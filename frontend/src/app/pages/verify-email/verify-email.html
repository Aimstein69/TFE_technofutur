<div class="verify-page">
  <video
    #backgroundVideo
    class="background-video"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
    aria-hidden="true"
  >
    <source src="/videos/datacenter-anime.mp4" type="video/mp4" />
  </video>

  <div class="video-overlay" aria-hidden="true"></div>

  <section class="verify-card">
    <img class="verify-logo" src="/images/privatechat-logo.png" alt="PrivateChat" />

    <h1>{{ 'verifyEmail.title' | translate }}</h1>

    <p>
      {{ 'verifyEmail.description' | translate }}
    </p>

    @if (errorMessage) {
      <p class="error-message" role="alert">
        {{ errorMessage }}
      </p>
    }

    @if (successMessage) {
      <p class="success-message" role="status">
        {{ successMessage }}
      </p>
    }

    <button type="button" (click)="confirmEmail()" [disabled]="isLoading">
      {{ isLoading ? ('verifyEmail.loading' | translate) : ('verifyEmail.submit' | translate) }}
    </button>
  </section>
</div>
