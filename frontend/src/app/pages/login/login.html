<div class="login-page">
  <!-- Vidéo d'arrière-plan -->
  <video
    #backgroundVideo
    class="login-video"
    autoplay
    loop
    muted
    playsinline
    preload="auto"
    aria-hidden="true"
  >
    <source src="/videos/datacenter-anime.mp4" type="video/mp4" />
  </video>

  <!-- Voile sombre bleuté pour améliorer la lisibilité -->
  <div class="login-overlay" aria-hidden="true"></div>

  <!-- Logo PrivateChat -->
  <a class="brand" routerLink="/" [attr.aria-label]="'login.home' | translate">
    <img src="/images/privatechat-logo.png" alt="" />
    <span>PrivateChat</span>
  </a>

  <section class="login-card">
    <h1>{{ 'login.title' | translate }}</h1>

    <form (ngSubmit)="login()">
      <label for="identifier">{{ 'login.identifierLabel' | translate }}</label>
      <input
        id="identifier"
        name="identifier"
        type="text"
        [(ngModel)]="identifier"
        autocomplete="username"
        [placeholder]="'login.identifierPlaceholder' | translate"
        required
      />

      <label for="password">{{ 'login.passwordLabel' | translate }}</label>
      <input
        id="password"
        name="password"
        type="password"
        [(ngModel)]="password"
        autocomplete="current-password"
        [placeholder]="'login.passwordPlaceholder' | translate"
        required
      />

      @if (errorMessage) {
        <p class="error-message">{{ errorMessage }}</p>
      }

      <button type="submit" [disabled]="isLoading">
        {{ isLoading ? ('login.loading' | translate) : ('login.submit' | translate) }}
      </button>
    </form>

    <p class="login-footer">
      {{ 'login.noAccount' | translate }}
      <a routerLink="/">{{ 'login.createAccount' | translate }}</a>
    </p>

    <a class="forgot-password-link" routerLink="/forgot-password">
      {{ 'login.forgotPassword' | translate }}
    </a>
  </section>
</div>
