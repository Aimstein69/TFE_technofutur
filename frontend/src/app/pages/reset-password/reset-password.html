<div class="auth-page">
  <video
    #backgroundVideo
    class="background-video"
    autoplay
    muted
    loop
    playsinline
    aria-hidden="true"
  >
    <source src="/videos/datacenter-anime.mp4" type="video/mp4" />
  </video>

  <div class="video-overlay"></div>

  <a class="brand" routerLink="/" [attr.aria-label]="'resetPassword.home' | translate">
    <img src="/images/privatechat-logo.png" alt="" />
    <span>PrivateChat</span>
  </a>

  <section class="auth-card">
    <h1>{{ 'resetPassword.title' | translate }}</h1>

    <p>{{ 'resetPassword.description' | translate }}</p>

    <form (ngSubmit)="submit()">
      <label for="password">{{ 'resetPassword.passwordLabel' | translate }}</label>

      <input
        id="password"
        name="password"
        type="password"
        [(ngModel)]="password"
        autocomplete="new-password"
        minlength="12"
        [placeholder]="'resetPassword.passwordPlaceholder' | translate"
        required
      />

      <label for="confirmPassword">{{ 'resetPassword.confirmPasswordLabel' | translate }}</label>

      <input
        id="confirmPassword"
        name="confirmPassword"
        type="password"
        [(ngModel)]="confirmPassword"
        autocomplete="new-password"
        minlength="12"
        [placeholder]="'resetPassword.confirmPasswordPlaceholder' | translate"
        required
      />

      @if (errorMessage) {
        <p class="error-message" role="alert">
          {{ errorMessage }}
        </p>
      }

      @if (successMessage) {
        <p class="success-message" role="status">
          {{ successMessage }}
        </p>
      }

      <button type="submit" [disabled]="isLoading || !token">
        {{
          isLoading ? ('resetPassword.loading' | translate) : ('resetPassword.submit' | translate)
        }}
      </button>
    </form>

    <p class="auth-footer">
      <a routerLink="/login">{{ 'resetPassword.backToLogin' | translate }}</a>
    </p>
  </section>
</div>
